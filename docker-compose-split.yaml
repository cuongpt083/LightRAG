# Docker Compose deployment for multi-workspace LightRAG with physical storage isolation (Cách 1)
# Workspaces: shared-business, shared-k12, private-business

x-lightrag-base: &lightrag-base
  image: ghcr.io/hkuds/lightrag:latest
  build:
    context: .
    dockerfile: Dockerfile
    tags:
      - ghcr.io/hkuds/lightrag:latest
  deploy:
    restart_policy:
      condition: on-failure
      max_attempts: 10
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &default-env
    WORKING_DIR: "/app/data/rag_storage"
    INPUT_DIR: "/app/data/inputs"
    PROMPT_DIR: "/app/data/prompts"
    # Container listens on 0.0.0.0 internally at port 9621
    HOST: "0.0.0.0"
    PORT: "9621"
    UI_TEMPLATES_DIR: "/app/data/ui_templates"

services:
  # ============================================================================
  # Workspace 1: shared-business
  # Default Port: 9621 (truy cập WebUI: http://<server-ip>:9621/webui)
  # ============================================================================
  lightrag-shared-business:
    <<: *lightrag-base
    container_name: lightrag-shared-business
    ports:
      - "${PORT_SHARED_BUSINESS:-9621}:9621"
    networks:
      study:
        aliases:
          - lightrag
    volumes:
      # Tách biệt hoàn toàn thư mục lưu trữ vật lý trên Host
      - ./data/workspaces/shared-business/rag_storage:/app/data/rag_storage
      - ./data/workspaces/shared-business/inputs:/app/data/inputs
      # Dùng chung prompt templates, UI templates và cấu hình LLM (.env)
      - ./data/prompts:/app/data/prompts
      - ./data/ui_templates:/app/data/ui_templates:ro
      - ./.env:/app/.env
      - ./lightrag:/app/lightrag:ro
    environment:
      <<: *default-env
      # Lưu ý: LightRAG tự chuẩn hóa ký tự '-' thành '_' (shared_business) trong nhãn/namespace
      WORKSPACE: "shared_business"

  # ============================================================================
  # Workspace 2: shared-k12
  # Default Port: 9622 (truy cập WebUI: http://<server-ip>:9622/webui)
  # ============================================================================
  lightrag-shared-k12:
    <<: *lightrag-base
    container_name: lightrag-shared-k12
    ports:
      - "${PORT_SHARED_K12:-9622}:9621"
    networks:
      - study
    volumes:
      # Tách biệt hoàn toàn thư mục lưu trữ vật lý trên Host
      - ./data/workspaces/shared-k12/rag_storage:/app/data/rag_storage
      - ./data/workspaces/shared-k12/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./data/ui_templates:/app/data/ui_templates:ro
      - ./.env:/app/.env
      - ./lightrag:/app/lightrag:ro
    environment:
      <<: *default-env
      WORKSPACE: "shared_k12"

  # ============================================================================
  # Workspace 3: private-business
  # Default Port: 9623 (truy cập WebUI: http://<server-ip>:9623/webui)
  # ============================================================================
  lightrag-private-business:
    <<: *lightrag-base
    container_name: lightrag-private-business
    ports:
      - "${PORT_PRIVATE_BUSINESS:-9623}:9621"
    networks:
      - study
    volumes:
      # Tách biệt hoàn toàn thư mục lưu trữ vật lý trên Host
      - ./data/workspaces/private-business/rag_storage:/app/data/rag_storage
      - ./data/workspaces/private-business/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./data/ui_templates:/app/data/ui_templates:ro
      - ./.env:/app/.env
      - ./lightrag:/app/lightrag:ro
    environment:
      <<: *default-env
      WORKSPACE: "private_business"

networks:
  study:
    external: true
